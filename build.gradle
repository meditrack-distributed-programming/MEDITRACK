// Plugin versions shared by every service. Each service applies the ones it needs.
plugins {
    id 'org.springframework.boot' version '4.1.3' apply false
}

// Common configuration for every module of the monorepo.
// Container projects such as ':services' have no code and are skipped.
configure(subprojects.findAll { it.childProjects.isEmpty() }) {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
